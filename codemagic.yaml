workflows: 

  android-apk-workflow:
    name: Android APK Generator (Debug)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: توليد ملفات gradlew المفقودة (Gradle 9.3.1 كما في gradle-wrapper.properties)
        script: |
          gradle wrapper --gradle-version 9.3.1
 
      - name: تجهيز مسار Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
 
      - name: إنشاء debug.keystore (مطلوب في جذر المشروع، وغير موجود لأنه ضمن .gitignore)
        script: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
 
      - name: صلاحية تنفيذ gradlew
        script: chmod +x ./gradlew
 
      - name: بناء نسخة Debug
        script: ./gradlew assembleDebug --stacktrace
 
    artifacts:
      - app/build/outputs/apk/**/*.apk
 
    publishing:
      email:
        recipients:
          - smg00477@gmail.com
        notify:
          success: true
          failure: true
 
  # ---------- 2) Release APK موقّعة: تحتاج رفع Keystore في Codemagic أولاً ----------
  android-release:
    name: Android APK Generator (Release موقّعة)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      android_signing:
        - raqeem_keystore     # استخدم هذا الاسم بالحرف عند رفع الشهادة (Code signing identities)
                               # مهم جدًا: alias الشهادة يجب أن يكون upload (هذا ما يتوقعه كودك بالضبط)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: توليد ملفات gradlew المفقودة (Gradle 9.3.1 كما في gradle-wrapper.properties)
        script: |
          gradle wrapper --gradle-version 9.3.1
 
      - name: تجهيز مسار Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
 
      - name: تمرير متغيرات الشهادة بالأسماء التي يقرأها كودك فعليًا
        script: |
          echo "export KEYSTORE_PATH=$CM_KEYSTORE_PATH" >> $CM_ENV
          echo "export STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> $CM_ENV
          echo "export KEY_PASSWORD=$CM_KEY_PASSWORD" >> $CM_ENV
 
      - name: صلاحية تنفيذ gradlew
        script: chmod +x ./gradlew
 
      - name: بناء نسخة Release موقّعة
        script: ./gradlew assembleRelease --stacktrace
 
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/**/mapping.txt
 
    publishing:
      email:
        recipients:
          - smg00477@gmail.com
        notify:
          success: true
          failure: true
 
