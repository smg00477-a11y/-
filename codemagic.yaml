
workflows:
 
  # ---------- 1) Debug APK: no signing setup needed, installs immediately ----------
  android-apk-workflow:
    name: Android APK Generator (Debug)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Generate missing gradlew files (Gradle 9.3.1, matching gradle-wrapper.properties)
        script: |
          gradle wrapper --gradle-version 9.3.1
 
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
 
      - name: Create debug.keystore (required at repo root, missing because it's gitignored)
        script: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
 
      - name: Grant execute permission to gradlew
        script: chmod +x ./gradlew
 
      - name: Build Debug APK
        script: ./gradlew assembleDebug --stacktrace
 
    artifacts:
      - app/build/outputs/apk/**/*.apk
 
    publishing:
      email:
        recipients:
          - smg00477@gmail.com
        notify:
          success: true
          failure: true
 
  # ---------- 2) Signed Release APK: requires uploading a keystore in Codemagic first ----------
  android-release:
    name: Android APK Generator (Release, signed)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      android_signing:
        - raqeem_keystore     # Use this exact name when uploading the keystore (Code signing identities)
                               # IMPORTANT: the keystore's key alias must be "upload" — that's what your code expects
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Generate missing gradlew files (Gradle 9.3.1, matching gradle-wrapper.properties)
        script: |
          gradle wrapper --gradle-version 9.3.1
 
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
 
      - name: Pass signing vars under the names your code actually reads
        script: |
          echo "export KEYSTORE_PATH=$CM_KEYSTORE_PATH" >> $CM_ENV
          echo "export STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> $CM_ENV
          echo "export KEY_PASSWORD=$CM_KEY_PASSWORD" >> $CM_ENV
 
      - name: Grant execute permission to gradlew
        script: chmod +x ./gradlew
 
      - name: Build signed Release APK
        script: ./gradlew assembleRelease --stacktrace
 
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/**/mapping.txt
 
    publishing:
      email:
        recipients:
          - smg00477@gmail.com
        notify:
          success: true
          failure: true
 
